<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento - Clínica Vida Plena</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Clínica Vida Plena</h1>
        <nav>
            <a href="index.html">Início</a>
            <a href="agendamento.html">Agendamento</a>
        </nav>
    </header>

    <main>
        <h2>Agende sua culsuta</h2>
        <form action="#" method="post">
            <label for="nome">Nome Completo:</label>
            <input type="text" name="nome" id="nome" required>
            <br>
            <label for="email">Email:</label>
            <input type="email" name="email" id="email">
            <br>
            <label for="telefone">Telefone:</label>
            <input type="tel" name="telefone" id="telefone" required inputmode="numeric" maxlength="15"
                pattern="(?:\(?[1-9]{2}\)?\s?)?(?:9\d{4}|\d{4})-?\d{4}"
                title="Digite com DDD. Ex: (17) 98765-4321 ou 17987654321">
            <br>
            <label for="data">Data:</label>
            <input type="date" name="data" id="data" required>
            <br>
            <label for="hora">Horário:</label>
            <input type="time" name="hora" id="hora" required>
            <br>
            <label for="especialidade">Especialidade:</label>
            <select name="especialidade" id="especialidade" required>
                <option value="">Selecione uma opção</option>
                <option value="clinico-geral">Clínico Geral</option>
                <option value="cardiologia">Cardiologia</option>
                <option value="dermatologia">Dermatologia</option>
                <option value="pediatria">Pediatria</option>
            </select>
            <br>
            <label for="mensagem">Mensegem:</label>
            <textarea name="mensagem" id="mensagem" rows="4"></textarea>
            <br>
            <button type="submit">Confirmar agendamento</button>
        </form>
    </main>

    <footer>
        <p>
            Clínica Vida Plena - Todos os direitos reservado.
        </p>
    </footer>
</body>

</html>
